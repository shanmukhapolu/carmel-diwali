<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">

  <title>Statistics | Carmel Diwali Festival</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="admin.css">
</head>

<body class="admin-auth-checking">

  <header class="topbar">
    <div class="topbar-inner">

      <div>
        <div class="brand-title">
          Carmel Diwali Festival of Lights
        </div>

        <div id="event-meta" class="brand-sub"></div>
      </div>

      <div class="admin-meta">
        <span id="admin-email"></span>
        <button id="logout" class="secondary">Logout</button>
      </div>

    </div>
  </header>

  <main class="layout">

<nav class="nav">
      <a href="/admin/">Dashboard</a>
      <a href="registrations.html">Volunteers</a>
      <a href="checkin.html">Check-In</a>
      <a class="active" href="statistics.html">Statistics</a>
    </nav>

    <section class="panel">

      <p class="eyebrow">Volunteer Analytics</p>

      <h1>Statistics</h1>

      <p class="muted">
        Review volunteer registrations, shift capacity, and event-day
        attendance.
      </p>

      <div
        class="stats-tabs"
        role="tablist"
      >

        <button
          class="secondary active"
          data-stats-tab="registration"
          type="button"
        >
          Registration Stats
        </button>

        <button
          class="secondary"
          data-stats-tab="dayof"
          type="button"
        >
          Day-of Attendance
        </button>

        <button
          id="generate-report"
          class="primary"
          type="button"
        >
          Generate Report
        </button>

      </div>

    </section>

    <section id="stats">
      <section class="panel">
        <p>Loading statistics…</p>
      </section>
    </section>

    <p
      id="error"
      class="error"
    ></p>

  </main>

  <script
    type="module"
    src="admin.js"
  ></script>

</body>
</html>
